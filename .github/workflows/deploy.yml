name: Deploy to GitHub Pages

# The site is a static Vite bundle. Building it here means dist/ never has to
# be committed: the repository stays source-only and every push to master
# republishes from a clean checkout.
on:
  push:
    branches: [master]
  workflow_dispatch:
  # Callable so the monthly GVP refresh can publish the commit it just pushed.
  # A workflow triggered by GITHUB_TOKEN does not itself trigger `push`, so the
  # refresh has to ask for the deploy explicitly.
  workflow_call:
    inputs:
      ref:
        description: The ref to build and publish. Defaults to the triggering ref.
        type: string
        required: false
        default: ""

# Least privilege: read the repo, write a Pages deployment, and mint the OIDC
# token deploy-pages exchanges for a deployment. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Unlike CI, an in-flight deploy is not cancelled —
# cancelling mid-publish can leave the live site on a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `inputs` is empty for push and dispatch, so this falls through to
          # the triggering ref in the normal case.
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v6

      - run: npm ci

      # Same gate as CI: a malformed CSV fails here, not in a browser.
      - run: npm test

      - run: npm run build

      # The same gate CI runs. Without it here, a bundle that reached for a CDN
      # or used an absolute asset path would publish anyway and only turn CI
      # red afterwards — the site would be broken and the deploy still green.
      - run: ./scripts/check-bundle.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
