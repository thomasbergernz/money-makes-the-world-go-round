name: CI

on:
  push:
    branches: [master]
  pull_request:

# The workflow only reads the repository; nothing here publishes or deploys.
permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unit tests plus validation of every shipped CSV: schema conformance,
      # unique ids, time scope, contested-date ranges, region and category
      # coverage. A malformed data row fails here rather than in a browser.
      - run: npm test

      - run: npm run build

      # The build must stay self-contained. A CDN reference or an absolute
      # asset path would break the site when served from a Pages subpath, and
      # neither shows up in the unit tests.
      #
      # Scope is the page and its bundles only. dist/data/ is deliberately
      # excluded: the schema has a `link` column holding a source URL per
      # event, which is a hyperlink for a reader to click, never something the
      # page fetches. Scanning it made every cited Wikipedia article look like
      # a CDN dependency and failed the job on ordinary data additions.
      #
      # The allowlist is only what legitimately appears in the page itself:
      # XML namespace identifiers emitted by d3, and the attribution link.
      - name: Check the bundle is self-contained
        run: |
          external=$(grep -rIoE 'https?://[a-zA-Z0-9./_-]+' dist/index.html dist/assets \
            | grep -vE 'www\.w3\.org|bl\.ocks\.org' || true)
          if [ -n "$external" ]; then
            echo "$external"
            echo "::error::Bundle references an unexpected external URL"
            exit 1
          fi
          if grep -qE '(src|href)="/[^/]' dist/index.html; then
            echo "::error::Bundle uses an absolute asset path; it will not serve from a subpath"
            exit 1
          fi
          echo "Bundle is self-contained."
