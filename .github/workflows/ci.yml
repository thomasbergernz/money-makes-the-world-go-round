name: CI

on:
  push:
    branches: [master]
  pull_request:

# The workflow only reads the repository; nothing here publishes or deploys.
permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unit tests plus validation of every shipped CSV: schema conformance,
      # unique ids, time scope, contested-date ranges, region and category
      # coverage. A malformed data row fails here rather than in a browser.
      - run: npm test

      - run: npm run build

      # Asserted by a script rather than inline shell, so CI and the deploy
      # run byte-identical logic. Two copies would drift, and drift is how the
      # data-link false positive survived as long as it did.
      - run: ./scripts/check-bundle.sh
