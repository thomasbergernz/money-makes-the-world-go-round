<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Money Makes the World Go Round — a correlation timeline</title>
    <meta
      name="description"
      content="Nature, economy, politics, science, religion and thought on one timeline, by region, from 3000 BC to today."
    />
  </head>
  <body>
    <header class="app-head">
      <h1>Money Makes the World Go Round</h1>
      <p class="tagline">
        Nature, economy, politics, science, religion and thought on one axis — roughly 3000&nbsp;BC to today.
        Drag on the lower band to zoom; move the pointer to read a single moment.
      </p>
      <div id="filters" class="filters"></div>
    </header>

    <main class="app-body">
      <div id="timeline" class="timeline"></div>
      <aside class="panel">
        <div class="panel-tabs" role="tablist" aria-label="Panel"></div>
        <div id="panel" role="tabpanel" aria-labelledby="panel-tab"></div>
        <div id="ask" class="ask" role="tabpanel" aria-labelledby="ask-tab" hidden></div>
      </aside>
    </main>

    <footer class="app-foot">
      <span id="status"></span>
      <span>
        Two-band brush concept after
        <a href="https://bl.ocks.org/rengel-de/5603464">rengel-de/5603464</a>.
      </span>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
